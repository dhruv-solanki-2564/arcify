name: Release

# Push a tag like v0.2.0 to build a signed APK and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Read version from tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH" >&2; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ARCIFY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret ARCIFY_KEYSTORE_BASE64 is missing; see docs/RELEASING.md" >&2; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arcify-release.jks"
          echo "ARCIFY_KEYSTORE=$RUNNER_TEMP/arcify-release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed release
        env:
          ARCIFY_KEYSTORE_PASSWORD: ${{ secrets.ARCIFY_KEYSTORE_PASSWORD }}
          ARCIFY_KEY_ALIAS: ${{ secrets.ARCIFY_KEY_ALIAS }}
          ARCIFY_KEY_PASSWORD: ${{ secrets.ARCIFY_KEY_PASSWORD }}
        run: >
          ./gradlew :core:testDebugUnitTest :blocker:testDebugUnitTest :app:assembleRelease
          -Parcify.versionName=${{ steps.version.outputs.name }} --console=plain

      - name: Verify signature and name the APK
        id: apk
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          out="Arcify-${{ steps.version.outputs.name }}.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${{ steps.version.outputs.name }}" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" \
            --title "Arcify ${{ steps.version.outputs.name }}" --generate-notes $pre

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/arcify-release.jks"
